[files]
extend-exclude = [
    "vendor-prefixed/",
    "build/",
    "js/*.min.js",
    "tests/",
    ".claude/",
]

[default.extend-words]
# WooCommerce post type name
placehold = "placehold"
# Jetpack post type name
migation = "migation"
# Company name (Automattic is correct)
Automattic = "Automattic"
# Existing message keys - can't rename without breaking stored logs
reseted = "reseted"
setted = "setted"
# Swedish month name in comment
juli = "juli"
# Accepted English variant of "unparsable"
unparseable = "unparseable"

[default.extend-identifiers]
commited = "commited"

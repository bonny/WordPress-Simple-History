name: Update readme and assets on WordPress.org
# Publishes readme.txt and .wordpress-org/ (screenshots, icon, banner)
# from main to WordPress.org, without a new release. Updates trunk and the
# stable tag's readme. Run by hand only: on every push it would publish readme
# edits meant for the next release, like "### Unreleased" changelog lines.
#
#   gh workflow run readme-assets.yml -R bonny/WordPress-Simple-History
on:
    workflow_dispatch:
jobs:
    update:
        name: Push readme and assets
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Install SVN (Subversion)
              run: |
                  sudo apt-get update
                  sudo apt-get install subversion

            - name: WordPress.org plugin readme/assets update
              uses: 10up/action-wordpress-plugin-asset-update@stable
              env:
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SLUG: simple-history
                  # Only copy readme.txt and .wordpress-org/, even when main has
                  # code changes since the last release.
                  IGNORE_OTHER_FILES: true

name: Deploy Tag to WordPress.org
on:
    workflow_dispatch:
    push:
        tags:
            # Semver (https://semver.org/) release pattern, deliberately with
            # no trailing wildcard. GitHub reads `*` as "anything after", so
            # the old `[0-9]+.[0-9]+.[0-9]+*` also matched a pre-release tag
            # like 5.34.0-dev — which would have pushed a development build
            # to the WordPress.org SVN repo for every user to auto-update to.
            # Every release tag in this repo's history is a plain X.Y.Z, so
            # the wildcard bought nothing. Pre-release tags now do not deploy;
            # use workflow_dispatch if one ever has to.
            - '[0-9]+.[0-9]+.[0-9]+'
jobs:
    tag:
        name: Deploy Tag
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@master

            - name: Build
              run: |
                  npm install
                  npm run build

            - name: Install SVN (Subversion)
              run: |
                  sudo apt-get update
                  sudo apt-get install subversion

            - name: WordPress.org Plugin Deploy
              uses: 10up/action-wordpress-plugin-deploy@stable
              env:
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SLUG: simple-history

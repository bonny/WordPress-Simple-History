# Run the wpunit suite against SQLite instead of MariaDB.
#
#   docker compose run --rm php-cli vendor/bin/codecept run wpunit --env sqlite
#
# Simple History supports both engines, and Log_Query takes a different path on
# each, so this is the only way to test the SQLite one.
#
# WPLoader picks SQLite when dbHost is empty and dbName is an absolute path
# inside the project. It then copies wp-browser's bundled SQLite drop-in to
# wp-content/db.php, which is what defines the DB_ENGINE constant that
# Log_Query::get_db_engine() reads.
#
# That drop-in lands in the shared `wordpress` volume, where it would make the
# MySQL test site use SQLite too. The SqliteDropinCleanup extension removes it
# after an SQLite run, and before any other suite in case a run was cut short.
# If it is ever left behind anyway, remove it by hand:
#
#   docker compose exec -u root wordpress rm -f /var/www/html/wp-content/db.php
#
# The directory below must exist before the run; tests/_data/sqlite/.gitkeep
# is committed for that reason.
modules:
    config:
        WPLoader:
            dbHost: ''
            dbName: '/srv/tests/_data/sqlite/db.sqlite'
